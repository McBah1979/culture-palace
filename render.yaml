services:
  - type: web
    name: stanichno-luganskiy-dk-app
    runtime: node
    plan: free
    buildCommand: echo "No dependencies to install"
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_LOGIN
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CONTENT_GITHUB_REPO
        value: McBah1979/culture-palace
      - key: CONTENT_GITHUB_TOKEN
        sync: false
